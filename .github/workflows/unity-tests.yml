# CI de tests para "El Sendero de las Estrellas".
# Añadido en la auditoría de seguimiento del 12 de agosto de 2026 (TDD.md §19.2/§19.4) —
# el proyecto no tenía ninguna verificación automática de build/tests hasta ahora.
#
# ⚠️ SETUP REQUERIDO ANTES DE QUE ESTO PUEDA PASAR EN VERDE:
# Este workflow usa game-ci/unity-test-runner, que necesita una licencia de Unity activada
# para poder abrir el proyecto en modo batch. Sin los secretos de abajo configurados en
# GitHub (Settings → Secrets and variables → Actions), el job fallará en el paso de
# activación de licencia, no por un fallo real de tests. Pasos (una sola vez):
#   1. Ejecuta manualmente el workflow "Unity — solicitar archivo de activación"
#      (.github/workflows/unity-request-activation-file.yml, botón "Run workflow" en la
#      pestaña Actions) y descarga el artefacto que genera (un archivo .alf).
#   2. Sube ese .alf en https://license.unity3d.com/manual (con tu cuenta de Unity) y
#      descarga el .ulf que te devuelve.
#   3. Crea estos secretos en el repo:
#        UNITY_LICENSE  → contenido completo del archivo .ulf descargado
#        UNITY_EMAIL    → el email de tu cuenta de Unity
#        UNITY_PASSWORD → la contraseña de tu cuenta de Unity
#   4. Borra el .alf/.ulf de tu disco si no los necesitas más (no los subas al repo).
# Documentación oficial: https://game.ci/docs/github/activation
name: Unity Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# unity-test-runner publica el resultado como un "check run" con githubToken; el token por
# defecto del repo es de solo lectura y GitHub rechaza crearlo («Resource not accessible by
# integration»), con lo que el job sale en rojo aunque los tests pasen. Ver INC-681.
permissions:
  contents: read
  checks: write

jobs:
  test:
    name: EditMode Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (con LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache de Library/ (acelera runs siguientes)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Solo EditMode por ahora: es lo único que tiene tests hoy (Assets/Scripts/Editor/Tests/).
      # PlayMode necesita más infraestructura (escena de test, display virtual) — añadir un
      # segundo job "testMode: playmode" cuando existan tests de ese tipo.
      #
      # Hasta tres intentos. En el runner, el editor recibe a veces un SIGKILL (código 137)
      # a los ~2 s de arrancar, antes de compilar nada (ver INC-888). Solo se reintenta si el
      # intento anterior no llegó a escribir editmode-results.xml: un test que falla de
      # verdad deja el XML y no se repite. Un error de compilación no lo deja, así que se
      # repite, pero falla igual en cada intento.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests1
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Quién mató al editor: el OOM killer deja rastro en dmesg; memoria y disco por si acaso.
      - name: Diagnóstico tras un intento sin resultados
        if: steps.tests1.outcome == 'failure' && hashFiles('test-results/editmode-results.xml') == ''
        run: |
          free -m
          df -h / /tmp
          sudo dmesg -T | grep -iE 'killed process|out of memory|oom' | tail -n 20 || true

      - name: Run EditMode tests (2.º intento)
        if: steps.tests1.outcome == 'failure' && hashFiles('test-results/editmode-results.xml') == ''
        uses: game-ci/unity-test-runner@v4
        id: tests2
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run EditMode tests (3.er intento)
        if: steps.tests2.outcome == 'failure' && hashFiles('test-results/editmode-results.xml') == ''
        uses: game-ci/unity-test-runner@v4
        id: tests3
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # El job lo decide el último intento que se ejecutó.
      - name: Resultado de los tests
        if: always()
        env:
          T1: ${{ steps.tests1.outcome }}
          T2: ${{ steps.tests2.outcome }}
          T3: ${{ steps.tests3.outcome }}
        run: |
          echo "Intentos: 1=$T1 2=$T2 3=$T3"
          for r in "$T3" "$T2" "$T1"; do
            [ "$r" = "success" ] && exit 0
            if [ "$r" = "failure" ]; then
              echo "::error::Los tests de EditMode han fallado. Ver el log del último intento."
              exit 1
            fi
          done
          exit 1

      - name: Subir resultados de los tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
